<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FBE9EE">
<meta name="format-detection" content="telephone=no">
<title>爱情剧本｜你是哪一种</title>
<style>
:root{
  --pink:#E88BA0;
  --pink-deep:#D4687F;
  --pink-soft:#FBE9EE;
  --pink-line:#F0CFD8;
  --ink:#4A2C3A;
  --muted:#A88B96;
  --bg:#FDF3F5;
  --paper:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:linear-gradient(160deg,#FDF3F5 0%,#FBE9EE 60%,#F8DDE5 100%);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.6;
}
.wrap{max-width:680px;margin:0 auto;padding:20px 18px 60px}
.hidden{display:none!important}
.card{
  background:var(--paper);
  border-radius:22px;
  padding:28px 22px;
  box-shadow:0 4px 24px rgba(212,104,127,.08);
  border:1px solid rgba(232,139,160,.15);
}
.progress{height:4px;background:rgba(232,139,160,.15);border-radius:2px;margin:8px 0 22px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--pink-deep);border-radius:2px;transition:width .3s}
.eyebrow{font-size:13px;color:var(--pink-deep);letter-spacing:2px;font-weight:600;margin-bottom:14px}
h1{font-size:26px;font-weight:800;line-height:1.35;margin:0 0 10px}
h1 em{font-style:normal;color:var(--pink-deep)}
.lead{font-size:14px;color:#7A5A68;line-height:1.8;margin:0 0 20px}
.muted{color:var(--muted);font-size:13px}
.btn{
  display:block;width:100%;border:none;border-radius:16px;padding:16px;
  font-size:16px;font-weight:700;cursor:pointer;
  background:var(--pink-deep);color:#fff;
  box-shadow:0 6px 18px rgba(212,104,127,.25);
  transition:transform .1s;
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--pink-deep);box-shadow:none;border:1.5px solid var(--pink-line)}
.btn.small{width:auto;display:inline-block;padding:12px 22px;font-size:14px}
.code-input{
  width:100%;text-align:center;font-size:30px;letter-spacing:10px;
  padding:14px;border:2px solid var(--pink-line);border-radius:14px;
  background:#fff;color:var(--ink);outline:none;
}
.code-input:focus{border-color:var(--pink)}
.opt{
  display:flex;align-items:flex-start;gap:14px;
  width:100%;text-align:left;
  background:#fff;border:1.5px solid var(--pink-line);
  border-radius:16px;padding:16px 16px;margin-bottom:12px;
  cursor:pointer;transition:.15s;
}
.opt:active{transform:scale(.99)}
.opt .dot{
  flex:0 0 22px;width:22px;height:22px;border-radius:50%;
  border:2px solid var(--pink-line);margin-top:3px;
  display:flex;align-items:center;justify-content:center;
}
.opt .txt b{display:block;font-size:16px;font-weight:700;color:var(--ink);line-height:1.4}
.opt.selected{border-color:var(--pink-deep);background:var(--pink-soft)}
.opt.selected .dot{border-color:var(--pink-deep);background:var(--pink-deep)}
.opt.selected .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.cat{font-size:13px;color:var(--pink-deep);font-weight:600;margin-bottom:10px}
.q-title{font-size:21px;font-weight:800;line-height:1.45;margin:0 0 22px}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.nav-row .hint{font-size:12px;color:var(--muted)}
.result-hero{text-align:center;padding:36px 20px 24px}
.result-hero .stamp{
  display:inline-block;padding:6px 16px;border-radius:20px;
  background:var(--pink-soft);color:var(--pink-deep);
  font-size:13px;letter-spacing:2px;margin-bottom:16px;
}
.result-hero h1{font-size:30px}
.result-hero .quote{font-size:14px;color:var(--muted);margin-top:8px}
.sec{margin-top:18px}
.sec h3{font-size:14px;color:var(--pink-deep);letter-spacing:1px;margin:0 0 10px}
.sec p{font-size:15px;color:#5A3D4A;line-height:1.85;margin:0}
.dim-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.dim-row .name{flex:0 0 60px;color:#7A5A68}
.dim-row .bar{flex:1;height:8px;background:var(--pink-soft);border-radius:4px;overflow:hidden}
.dim-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--pink-deep));border-radius:4px}
.dim-row .num{flex:0 0 30px;text-align:right;color:var(--pink-deep);font-weight:700}
.lines{padding-left:0;list-style:none;margin:0}
.lines li{
  padding:12px 14px;background:var(--pink-soft);border-radius:12px;
  margin-bottom:8px;font-size:14.5px;color:var(--ink);
}
.tag-row{text-align:center;margin:10px 0 0}
.tag-row span{
  display:inline-block;margin:3px;padding:4px 12px;border-radius:14px;
  background:#fff;border:1px solid var(--pink-line);font-size:12px;color:var(--pink-deep);
}
.note{
  background:var(--pink-soft);border-radius:14px;padding:14px 16px;
  font-size:13px;color:#7A5A68;line-height:1.7;margin-top:16px;
  border:1px solid var(--pink-line);
}
.share-img{width:100%;display:block;border-radius:16px;margin-top:12px;border:1px solid var(--pink-line)}
.tip-longpress{
  text-align:center;font-size:12.5px;color:var(--muted);
  background:#fff;border:1px dashed var(--pink-line);border-radius:12px;
  padding:10px;margin-top:10px;
}
.err{color:#C0392B;font-size:13px;margin-top:10px;text-align:center;min-height:18px}
.admin-box{font-size:13px;color:#5A3D4A;line-height:1.9}
.admin-box b{color:var(--pink-deep)}
</style>
</head>
<body>
<div class="wrap">

  <!-- 验证码页 -->
  <div id="pageCode" class="card" style="margin-top:40px">
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:40px;margin-bottom:10px">&#128140;</div>
      <h1 style="font-size:22px">爱情剧本测试</h1>
      <p class="muted">输入 6 位访问码，解锁你的感情档案</p>
    </div>
    <input class="code-input" id="codeInput" type="tel" inputmode="numeric" maxlength="6" placeholder="······" autocomplete="off">
    <div id="codeErr" class="err"></div>
    <button class="btn" onclick="checkCode()">解锁</button>
    <div class="note" id="codeNote"></div>
  </div>

  <!-- 开场页 -->
  <div id="pageIntro" class="card hidden" style="margin-top:30px">
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:44px;margin-bottom:8px">&#127800;</div>
      <div class="eyebrow">LOVE ARCHIVE · 私人档案</div>
      <h1>你骨子里是<em>哪种爱情</em>？</h1>
      <p class="lead">
        心理学说，一段感情由三种成分构成：亲密、激情、承诺。<br>
        通过 22 个感情里的真实情境，读取你在这三角里的模样，<br>
        最后告诉你：你的爱情，是哪一种剧本。
      </p>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
      <div style="background:var(--pink-soft);border-radius:14px;padding:14px;text-align:center">
        <b style="display:block;color:var(--pink-deep);font-size:18px">22 情境</b>
        <small class="muted">约 4 分钟</small>
      </div>
      <div style="background:var(--pink-soft);border-radius:14px;padding:14px;text-align:center">
        <b style="display:block;color:var(--pink-deep);font-size:18px">8 种剧本</b>
        <small class="muted">基于爱情三角理论</small>
      </div>
    </div>
    <button class="btn" onclick="startQuiz()">开始读心</button>
    <div class="note">本测试基于斯滕伯格爱情三角理论的通俗化改编，结果供自我探索参考，不构成任何专业评估。</div>
  </div>

  <!-- 答题页 -->
  <div id="pageQuiz" class="hidden" style="margin-top:20px">
    <div class="progress"><i id="bar" style="width:0%"></i></div>
    <div class="card">
      <div class="cat" id="qCat"></div>
      <h2 class="q-title" id="qTitle"></h2>
      <div id="qOpts"></div>
      <div class="nav-row">
        <button class="btn ghost small" id="prevBtn" onclick="prevQ()">上一题</button>
        <span class="hint" id="qHint">选择后自动进入下一题</span>
      </div>
    </div>
  </div>

  <!-- 结果页 -->
  <div id="pageResult" class="hidden" style="margin-top:20px"></div>

</div>

<script>
/* ==================== 商家配置区 ==================== */
/* 说明：全网通用一个固定访问密码，所有客人都输这一串。
   想改密码，只改下面 ACCESS_CODE 的值即可（保持 6 位数字）。 */

const ACCESS_CODE = "131452";            // 固定访问密码（6 位数字），所有客人通用

/* 结果判定参数（决定 8 种剧本的分布，别乱改）
   判定方式：先算三维度在你全部有效作答里的占比，占比 ≥30% 记为「高」；
   若有效作答不足 8 题（大半选了「无所谓」），则视为尚未成型，判为无爱状态。 */
const HIGH_PCT = 30;
const MIN_VALID = 11;
const BRAND_LINE = "";                   // 结果图底部署名，留空则不显示，例如："金安念宠 · 出品"


/* ==================== 内容配置区 ==================== */

/* 爱情三角三维度 */
const DIMS = ["亲密","激情","承诺"];

/*
  8 种爱情剧本 = 斯滕伯格爱情三角的 8 种组合
  组合顺序：[亲密高?, 激情高?, 承诺高?]
*/
const ARCH = {
  xiangru: {
    name:"相濡以沫型",
    sub:"圆满之爱 · 最健康的模样",
    theory:"圆满之爱（Consummate Love）",
    combo:[1,1,1],
    tags:["亲密满格","心动常在","认定彼此"],
    portrait:"你是极少见的「三角齐全」型：和 TA 无话不谈、见到 TA 仍然会心动，也把 TA 认真写进了未来。心理学认为这是爱情最圆满的状态——既有朋友般的深度理解，又有恋人般的炽热吸引，还有共度一生的决心。",
    blind:"圆满之爱最怕「习以为常」。激情会随时间自然波动，若把一切都当作理所当然，三角会悄悄缺掉一角。",
    advice:"定期制造「新体验」——一起去没去过的地方，别让日子只剩习惯。圆满需要经营，不只是天生。",
    lines:["懂我、心动、认定你，我全占了。","日子很长，但我还是想跟你过。","别人有的浪漫我们有，别人没有的懂得我们也有。"],
    match:{name:"细水长流型", why:"你们都是长期主义者，不作不闹，能把圆满稳稳守住，日子越过越厚"},
  },
  jinghong: {
    name:"惊鸿一瞥型",
    sub:"浪漫之爱 · 心动与懂得都在",
    theory:"浪漫之爱（Romantic Love）",
    combo:[1,1,0],
    tags:["一见心动","灵魂共鸣","还没谈未来"],
    portrait:"你的爱情里，亲密和激情都在线：你们懂彼此、在一起有化学反应，只是还没认真聊过「我们要往哪走」。心理学把这叫浪漫之爱——很美好，也带着不确定性。",
    blind:"只有浪漫没有承诺的关系，容易被现实的浪冲散。上头期过去之后，靠什么留下？",
    advice:"别急着定义关系，但也别一直回避。找个合适的时机，认真聊一次未来。",
    lines:["我们心动是真的，方向还没定也是真的。","别急着问我未来，先享受这一刻。","但我其实，想知道你愿不愿意认真。"],
    match:{name:"细水长流型", why:"TA 给你落地的踏实，你给 TA 久违的心跳，正好补上彼此缺的那一角"},
  },
  xishui: {
    name:"细水长流型",
    sub:"同伴之爱 · 最牢固的陪伴",
    theory:"同伴之爱（Companionate Love）",
    combo:[1,0,1],
    tags:["安稳","信任","一起扛事"],
    portrait:"你要的不是轰轰烈烈，是舒服：无话不说的默契 + 一起过日子的决心。心理学把这种「亲密+承诺、激情温和」的状态叫同伴之爱——大量白头偕老的爱情，最后都长成这个样子。",
    blind:"太稳的爱情容易少了点心动。激情偏低不是问题，但别让它低到只剩「搭伙过日子」。",
    advice:"定期给对方一点小惊喜、小浪漫，让平淡的日子偶尔发个光。温情是底色，别忘了偶尔加点火花。",
    lines:["我不要烟花，我要每天的晚饭。","爱到最后，都是陪伴。","日子平淡，但我没想过换人。"],
    match:{name:"惊鸿一瞥型", why:"TA 的浪漫能把你从习惯里拽出来，你的安稳也能让 TA 不再飘着"},
  },
  huanxi: {
    name:"欢喜冤家型",
    sub:"喜欢之爱 · 知己以上恋人未满",
    theory:"喜欢之爱（Liking）",
    combo:[1,0,0],
    tags:["无话不谈","互怼","还差临门一脚"],
    portrait:"你们之间最浓的是亲密：懂彼此、能互怼、有灵魂的默契，但心动的火苗和「认定」的决心都还差一口气。心理学把这叫喜欢之爱——很多好关系的前奏，也可能是友情以上的原地踏步。",
    blind:"一直停在「懂」而不「燃」，容易被归类成朋友。「我们到底是什么」不解决，就永远差临门一脚。",
    advice:"如果心里有火苗，就试着点破一次；如果没有，也别硬装恋人。搞清楚自己要什么，比拖着强。",
    lines:["你懂我，比谁都懂。","但我们之间，还差一层窗户纸。","我怕戳破，又怕永远不戳破。"],
    match:{name:"飞蛾扑火型", why:"TA 敢往前冲，能替你捅破那层窗户纸；你的懂得也能让 TA 慢下来看清人"},
  },
  aier: {
    name:"爱而不得型",
    sub:"迷恋之爱 · 上头但没落地",
    theory:"迷恋之爱（Infatuation）",
    combo:[0,1,0],
    tags:["强烈心动","患得患失","未深入了解"],
    portrait:"你为 TA 魂牵梦萦、心跳加速，但你们之间还没有足够的深度理解，也还没有承诺。心理学把这叫迷恋——强烈的激情燃烧在没有地基的地方，所以它美丽，也容易受伤。",
    blind:"你爱上的往往是「想象中的 TA」，不是真实的 TA。自我感动的投入，最后伤到的只有自己。",
    advice:"把迷恋和爱分开看。要么鼓起勇气问清楚，要么给自己设一个止损点，别再让想象消耗你。",
    lines:["我放不下的，是我想象里的你。","你说句话，我就有勇气问一句。","可我也怕，答案不是我要的。"],
    match:{name:"细水长流型", why:"你需要一个把你从想象里拉回现实的人，TA 的稳定正好是解药"},
  },
  xiangjing: {
    name:"相敬如宾型",
    sub:"空洞之爱 · 有承诺缺温度",
    theory:"空洞之爱（Empty Love）",
    combo:[0,0,1],
    tags:["有责任","体面","心却远了"],
    portrait:"你们还彼此担着责任、维持着体面，但心与心之间已经不太靠近了：没有了深入的交流，也少了心动。心理学把这叫空洞之爱——很多长期关系走到后期，就是这个样子。",
    blind:"靠「责任」硬撑的关系，双方都会越来越孤独。表面和谐，内里空转。",
    advice:"别假装没事。坦诚谈一次：是修复，还是体面结束？空转的感情，拖得越久越难收场。",
    lines:["我们还在，但我们不在了。","不是没感情，是不知道感情去哪了。","要不要，重新认识一次？"],
    match:{name:"欢喜冤家型", why:"你们缺的不是责任，是重新聊天、重新靠近——先从做回朋友开始"},
  },
  feie: {
    name:"飞蛾扑火型",
    sub:"愚蠢之爱 · 快热也快冷",
    theory:"愚蠢之爱（Fatuous Love）",
    combo:[0,1,1],
    tags:["猛烈","快速认定","缺乏了解"],
    portrait:"你爱得很猛：上头、认定、扑上去，速度之快连了解都来不及。心理学把这叫愚蠢之爱——激情和承诺都很足，唯独缺了亲密的打底，最容易闪婚闪离。",
    blind:"爱得越快，越容易看走眼。上头期你会自动补全 TA 的缺点，等清醒过来才看见落差。",
    advice:"激情上头时，给自己留一个「了解期」：多一起经历事、多聊三观，别急着把未来全押上。",
    lines:["我知道危险，但我还是想扑过去。","不是我不清醒，是我太想你了。","可我也想确认，我们认不认识真正的彼此。"],

  xiangwang: {
    name:"相忘江湖型",
    sub:"无爱状态 · 还没遇见或已放下",

    combo:[0,0,0],
    tags:["自由","放空","不将就"],
    portrait:"你现在的三角处于「待机」状态：没有强烈的亲密联结，也没有心动的对象或承诺的牵绊。可能是还没遇见让你认真的人，也可能是刚结束一段、心在放空。这没什么不好——这是你的自由期。",
    blind:"把「没心动」当成「不会爱了」，会错过真正适合你的人。",
    advice:"不用急着填满空白。先把自己过好，爱情来了自然接得住。江湖路远，先做自己的主角。",

/* 剧本 → 匹配顺序 */
const ARCH_ORDER = ["xiangru","jinghong","xishui","huanxi","aier","xiangjing","feie","xiangwang"];

/*
  16 道题：[分类, 题干, [[选项, 维度], ...]]
  每个选项只映射一个维度；界面不显示维度标签。「零」表示不计分。
*/
const QUESTIONS = [
  ["心动 · 瞬间","你突然发现自己对一个人上头，最可能是哪种瞬间？",[
    ["TA 冲你笑了一下，就那一下，心跳漏拍","激情"],
    ["TA 记得你随口说过的喜好，你觉得被看见了","亲密"],
    ["TA 做事靠谱、靠谱到让你觉得可以托付","承诺"],

  ["暧昧 · 聊天","凌晨 TA 给你分享了一首歌，一个字都没说。你会？",[
    ["反复听，心里一直琢磨 TA 是什么意思","激情"],
    ["回一句「这歌我也在循环」，把话头接住","亲密"],
    ["想着找机会约 TA 出来，认真认识一下","承诺"],
    ["点个赞或者已读，不会多想","零"]
  ]],
  ["暧昧 · 节奏","你们天天聊，已经三个月了，谁都没捅破。你心里怎么想？",[

/* ==================== 访问码系统 ==================== */

const STORE_KEY = "loveTestV1";

function hashCode(s){
  let h1 = 0x811C9DC5, h2 = 0x01000193;
  for(let i=0;i<s.length;i++){
    const c = s.charCodeAt(i);
    h1 = (h1 ^ c) >>> 0;
    h1 = Math.imul(h1, 0x01000193) >>> 0;
    h2 = (h2 + (Math.imul((h2 ^ c) >>> 0, 0x85EBCA6B) >>> 0)) >>> 0;
    h2 = (((h2 << 13) | (h2 >>> 19)) >>> 0);
  }
  return ("00000000" + h1.toString(16)).slice(-8) + ("00000000" + h2.toString(16)).slice(-8);
}

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { uses:{}, tries:0, lockUntil:0, unlocked:null, progress:null };
}
function saveStore(s){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){}
}
let store = loadStore();

function checkCode(){
  const v = (document.getElementById('codeInput').value || "").trim();
  const err = document.getElementById('codeErr');

  if(!/^\d{6}$/.test(v)){ err.textContent = "请输入 6 位数字访问码"; return; }

  const now = Date.now();
  if(store.lockUntil && now < store.lockUntil){
    const sec = Math.ceil((store.lockUntil - now)/1000);
    err.textContent = "尝试次数过多，请 " + sec + " 秒后再试";
    return;
  }

  if(v === ACCESS_CODE){
    store.tries = 0; store.lockUntil = 0;
    store.unlocked = 1;
    store.progress = null;
    saveStore(store);
    err.textContent = "";
    enterIntro();
  } else {
    store.tries = (store.tries || 0) + 1;
    if(store.tries >= 5){ store.lockUntil = now + 60*1000; store.tries = 0; }
    saveStore(store);
    err.textContent = "访问码无效，请核对后重试";
  }
}

document.getElementById('codeInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') checkCode();
});
document.getElementById('codeInput').addEventListener('input', function(){
  this.value = this.value.replace(/\D/g,'').slice(0,6);
});

/* ==================== 流程 ==================== */

let state = { idx:0, scores:{亲密:0, 激情:0, 承诺:0}, answers:[] };

function show(id){
  ['pageCode','pageIntro','pageQuiz','pageResult'].forEach(p=>{
    document.getElementById(p).classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
}

function enterIntro(){
  show('pageIntro');
  window.scrollTo({top:0});
  if(store.progress && store.progress.finished){
    // 已测完过，直接进入结果
    state.scores = store.progress.scores || {亲密:0, 激情:0, 承诺:0};
    state.idx = QUESTIONS.length;
    document.getElementById('pageIntro').classList.add('hidden');
    document.getElementById('pageResult').classList.remove('hidden');
    finish(true);
  } else if(store.progress && store.progress.idx > 0){
    state.idx = store.progress.idx;
    state.scores = store.progress.scores || {亲密:0, 激情:0, 承诺:0};
    state.answers = store.progress.answers || [];
    document.getElementById('pageIntro').classList.add('hidden');
    document.getElementById('pageQuiz').classList.remove('hidden');
    renderQ();
    syncBar();
  }
}

function startQuiz(){
  state = { idx:0, scores:{亲密:0, 激情:0, 承诺:0}, answers:[] };
  store.progress = { idx:0, scores:state.scores, answers:[], finished:false };
  saveStore(store);
  show('pageQuiz');
  renderQ();
  window.scrollTo({top:0});
}

function syncBar(){
  const p = state.idx / QUESTIONS.length * 100;
  document.getElementById('bar').style.width = p + '%';
}

function renderQ(){
  const q = QUESTIONS[state.idx];
  syncBar();
  document.getElementById('qCat').textContent = q[0] + ' · ' + (state.idx+1) + '/' + QUESTIONS.length;
  document.getElementById('qTitle').textContent = q[1];
  const box = document.getElementById('qOpts');
  box.innerHTML = '';
  q[2].forEach((opt, oi)=>{
    const btn = document.createElement('button');
    btn.className = 'opt' + (state.answers[state.idx] === oi ? ' selected' : '');
    btn.innerHTML = '<span class="dot"></span><span class="txt"><b>' + opt[0] + '</b></span>';
    btn.onclick = ()=>{
      const prev = state.answers[state.idx];
      if(prev !== undefined && prev !== oi){
        const pd = QUESTIONS[state.idx][2][prev][1];
        if(pd !== '零') state.scores[pd] = Math.max(0, (state.scores[pd]||0) - 1);
      }
      if(prev !== oi){
        const d = opt[1];
        if(d !== '零') state.scores[d] = (state.scores[d]||0) + 1;
      }
      state.answers[state.idx] = oi;
      box.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
      btn.classList.add('selected');
      saveProgress();
      setTimeout(()=>nextQ(), 280);
    };
    box.appendChild(btn);
  });
  document.getElementById('prevBtn').style.visibility = state.idx===0 ? 'hidden' : 'visible';
}

function saveProgress(){
  store.progress = { idx:state.idx, scores:state.scores, answers:state.answers, finished:false };
  saveStore(store);
}

function nextQ(){
  state.idx++;
  if(state.idx >= QUESTIONS.length){
    finish(false);
  } else {
    saveProgress();
    renderQ();
    window.scrollTo({top:0,behavior:'smooth'});
  }
}
function prevQ(){
  if(state.idx > 0){ state.idx--; saveProgress(); renderQ(); }
}

function restart(){
  if(confirm("确定要重新测试吗？当前结果会清空。")){
    startQuiz();
  }
}

function finish(){
  show('pageResult');
  store.progress = { idx:state.idx, scores:state.scores, answers:state.answers, finished:true };
  saveStore(store);

  /* 三轴占比：三者相加约 100%，即「你的爱情由什么构成」 */
  const total = DIMS.reduce((a,d)=>a + (state.scores[d]||0), 0);

        DIMS.map((d,i)=>d+(hi[i]?' 高':' 低')).join('、') + '」，对应心理学中的「' + arch.theory + '」——' +

/* ==================== Canvas 出图（支持微信长按保存） ==================== */

function buildImg(){
  const {arch, pct} = window.__result;
  const W = 750, margin = 50;
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');

  const wrap = (text, maxW) => {
    ctx.font = '26px "PingFang SC", sans-serif';
    const lines = []; let line = '';
    for(const ch of text){
      const test = line + ch;
      if(ctx.measureText(test).width > maxW && line){
        // 英文单词不拆行：把行尾的整段字母数字移到下一行
        if(/[A-Za-z0-9]/.test(ch)){
          const m = line.match(/[A-Za-z0-9]+$/);
          if(m && m.index > 0){
            lines.push(line.slice(0, m.index));
            line = line.slice(m.index) + ch;
            continue;
          }
        }
        lines.push(line); line = ch;
      } else line = test;
    }
    if(line) lines.push(line);
    return lines;
  };

  const bodyW = W - margin*2;
  const portraitLines = wrap(arch.portrait, bodyW);
  const blindLines = wrap(arch.blind, bodyW);
  const adviceLines = wrap(arch.advice, bodyW);
  const matchLines = wrap(arch.match.name + '　' + arch.match.why, bodyW);
  const brandH = BRAND_LINE ? 60 : 0;

  const H = 240 + portraitLines.length*42 + 120 + DIMS.length*50 + 100
          + blindLines.length*42 + 80 + adviceLines.length*42 + 120
          + arch.lines.length*60 + 80 + matchLines.length*42 + 100 + brandH;
  c.width = W; c.height = H;

  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#FDF3F5'); bg.addColorStop(1,'#F8DDE5');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  let y = 70;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#D4687F'; ctx.font = '600 22px sans-serif';
  ctx.fillText('你骨子里是哪种爱情', W/2, y); y += 30;
  ctx.fillStyle = '#4A2C3A'; ctx.font = '800 44px sans-serif';
  ctx.fillText(arch.name, W/2, y+40); y += 60;
  ctx.fillStyle = '#A88B96'; ctx.font = '400 22px sans-serif';
  ctx.fillText(arch.sub + ' · ' + arch.theory, W/2, y); y += 40;

  ctx.strokeStyle = '#F0CFD8'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(margin, y+10); ctx.lineTo(W-margin, y+10); ctx.stroke();
  y += 50;

  ctx.textAlign = 'left';
  ctx.fillStyle = '#D4687F'; ctx.font = '700 22px sans-serif';
  ctx.fillText('这就是你', margin, y); y += 20;
  ctx.fillStyle = '#5A3D4A'; ctx.font = '400 26px "PingFang SC", sans-serif';
  portraitLines.forEach(l=>{ ctx.fillText(l, margin, y+30); y += 42; });
  y += 30;

  ctx.fillStyle = '#D4687F'; ctx.font = '700 22px sans-serif';
  ctx.fillText('你的爱情三角', margin, y); y += 30;
  DIMS.forEach((d,i)=>{
    ctx.fillStyle = '#7A5A68'; ctx.font = '400 22px sans-serif';
    ctx.fillText(d, margin, y+22);
    ctx.fillStyle = '#FBE9EE';
    roundRect(ctx, margin+110, y+8, bodyW-160, 16, 8); ctx.fill();
    ctx.fillStyle = '#E88BA0';
    roundRect(ctx, margin+110, y+8, (bodyW-160)*pct[i]/100, 16, 8); ctx.fill();
    ctx.fillStyle = '#D4687F'; ctx.font = '700 22px sans-serif'; ctx.textAlign='right';
    ctx.fillText(pct[i], W-margin, y+24);
    ctx.textAlign='left';
    y += 50;
  });
  y += 20;

  ctx.fillStyle = '#D4687F'; ctx.font = '700 22px sans-serif';
  ctx.fillText('你的盲点', margin, y); y += 20;
  ctx.fillStyle = '#5A3D4A'; ctx.font = '400 26px "PingFang SC", sans-serif';
  blindLines.forEach(l=>{ ctx.fillText(l, margin, y+30); y += 42; });
  y += 30;

  ctx.fillStyle = '#D4687F'; ctx.font = '700 22px sans-serif';
  ctx.fillText('给你的建议', margin, y); y += 20;
  ctx.fillStyle = '#5A3D4A'; ctx.font = '400 26px "PingFang SC", sans-serif';
  adviceLines.forEach(l=>{ ctx.fillText(l, margin, y+30); y += 42; });
  y += 30;

  ctx.fillStyle = '#D4687F'; ctx.font = '700 22px sans-serif';
  ctx.fillText('你的三句台词', margin, y); y += 20;
  arch.lines.forEach(l=>{
    ctx.fillStyle = '#FBE9EE';
    roundRect(ctx, margin, y, bodyW, 48, 10); ctx.fill();
    ctx.fillStyle = '#4A2C3A'; ctx.font = '400 24px "PingFang SC", sans-serif';
    ctx.fillText('“'+l+'”', margin+20, y+32);
    y += 60;
  });

  y += 20;

  ctx.textAlign = 'left';
  ctx.fillStyle = '#D4687F'; ctx.font = '700 22px sans-serif';
  ctx.fillText('你的最佳拍档', margin, y); y += 20;
  ctx.fillStyle = '#5A3D4A'; ctx.font = '400 26px "PingFang SC", sans-serif';
  matchLines.forEach(l=>{ ctx.fillText(l, margin, y+30); y += 42; });

  y += 40;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#A88B96'; ctx.font = '400 18px sans-serif';
  ctx.fillText('爱情剧本 · 基于爱情三角理论的自我探索', W/2, y);
  if(BRAND_LINE){
    y += 34;
    ctx.fillStyle = '#D4687F'; ctx.font = '600 20px sans-serif';
    ctx.fillText(BRAND_LINE, W/2, y);
  }

  const url = c.toDataURL('image/png');
  window.__imgUrl = url;
  const box = document.getElementById('imgBox');
  if(box){
    box.innerHTML = '<img class="share-img" src="' + url + '" alt="我的爱情剧本结果">';
    document.getElementById('longpressTip').style.display = 'block';
  }
}

function downloadImg(){
  if(!window.__imgUrl){ alert("图片还没生成好，稍等一下再点"); return; }
  const a = document.createElement('a');
  a.href = window.__imgUrl;
  a.download = '我的爱情剧本.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ==================== 商家后台：?admin=1 查看本机使用情况 ==================== */
(function(){
  const q = new URLSearchParams(location.search);
  const admin = q.get('admin');
  if(admin === '1'){
    document.getElementById('pageCode').classList.add('hidden');
    const status = store.unlocked ? '本机已解锁（曾经输过密码）' : '本机尚未解锁';
    const box = document.createElement('div');
    box.className = 'card admin-box';
    box.style.marginTop = '30px';
    box.innerHTML =
      '<h1 style="font-size:20px">商家后台（仅本机可见）</h1>' +
      '<p><b>访问密码：</b>' + ACCESS_CODE + '（所有客人通用）</p>' +
      '<p><b>本机状态：</b>' + status + '</p>' +
      '<p class="muted">想改密码，改源码里 ACCESS_CODE 的值即可。</p>';
    document.querySelector('.wrap').appendChild(box);
    return;
  }

  /* 带码直链 ?code= 自动填充并验证（用于自动发货：客人点开即进，无需手输密码） */
  const preset = q.get('code');
  if(preset){
    if(store.unlocked){ enterIntro(); return; }
    const inp = document.getElementById('codeInput');
    if(inp) inp.value = preset;
    checkCode();
    if(store.unlocked) return;
  }

  /* 已解锁过 → 免密直接进入 */
  if(store.unlocked){ enterIntro(); }
})();
</script>
